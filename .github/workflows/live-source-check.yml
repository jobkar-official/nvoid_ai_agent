name: Live job source check

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/live-source-check.yml
      - config/mcp-servers.json
      - scripts/public-job-boards-mcp-server.cjs
      - scripts/remoteok-mcp-server.cjs
      - scripts/live-source-smoke.mjs
      - src/jobs/job-discovery.service.ts
      - src/jobs/job-relevance.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PORT: "3100"
      AGENT_API_KEY: nvoid-live-source-smoke-key-only
      MCP_SERVERS_CONFIG: ./config/mcp-servers.json
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      AUTO_SUBMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --check scripts/remoteok-mcp-server.cjs
      - run: node --check scripts/remoteok-mcp-server.cjs
      - run: node --check scripts/public-job-boards-mcp-server.cjs
      - run: node --check scripts/apify-job-boards-mcp-server.cjs
      - run: node --check scripts/live-source-smoke.mjs
      - name: Build worker image with all configured MCP runtimes
        run: docker build --tag nvoid-agent:live-check .
      - name: Start worker image and verify live provider results
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force nvoid-live-agent >/dev/null 2>&1 || true
          docker run --detach --name nvoid-live-agent --network host \\
            --env NODE_ENV=production \\
            --env PORT="$PORT" \\
            --env AGENT_API_KEY="$AGENT_API_KEY" \\
            --env MCP_SERVERS_CONFIG=/app/config/mcp-servers.json \\
            --env REDIS_HOST=127.0.0.1 \\
            --env REDIS_PORT=6379 \\
            --env AUTO_SUBMIT_ENABLED=false \\
            nvoid-agent:live-check
          cleanup() {
            docker logs nvoid-live-agent 2>&1 || true
            docker rm --force nvoid-live-agent >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:3100/api/health > /tmp/nvoid-live-health.json 2>/dev/null; then
              break
            fi
            container_state="$(docker inspect --format='{{.State.Status}}' nvoid-live-agent 2>/dev/null || true)"
            if [ "$container_state" != "running" ]; then
              docker logs nvoid-live-agent || true
              exit 1
            fi
            sleep 1
          done
          cat /tmp/nvoid-live-health.json
          node scripts/live-source-smoke.mjs
