services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  job-agent-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_SERVERS_CONFIG: /app/config/mcp-servers.json
      RESUME_STORAGE_DIR: /app/private-resumes
      SCREENSHOT_DIR: /app/artifacts
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config:/app/config:ro
      - ./private-resumes:/app/private-resumes
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
